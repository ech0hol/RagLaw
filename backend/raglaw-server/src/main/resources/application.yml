server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: raglaw-server
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:raglaw}
    password: ${RABBITMQ_PASSWORD:raglaw}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:raglaw}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:raglaw}
    password: ${MYSQL_PASSWORD:raglaw}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8
  security:
    filter:
      dispatcher-types: async,error,request,forward

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

raglaw:
  version: 0.1.0-SNAPSHOT
  routing:
    mode: ${RAGLAW_ROUTING_MODE:SHADOW}
  context:
    mode: ${RAGLAW_CONTEXT_MODE:SHADOW}
    model-window-tokens: ${RAGLAW_CONTEXT_MODEL_WINDOW_TOKENS:32000}
  seed:
    admin-password: ${RAGLAW_SEED_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:raglaw-dev-secret-change-me-32chars-min}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:120}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rag:
    elasticsearch:
      enabled: ${ELASTICSEARCH_ENABLED:false}
      uri: ${ELASTICSEARCH_URI:http://localhost:9200}
      index-name: raglaw_chunks
    minio:
      enabled: ${MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:raglaw}
      secret-key: ${MINIO_SECRET_KEY:raglawsecret}
      bucket: ${MINIO_BUCKET:raglaw}
    storage:
      local-temp-dir: ${RAG_LOCAL_TEMP_DIR:./tmp/raglaw-uploads}
    embedding:
      enabled: ${EMBEDDING_ENABLED:false}
      api-key: ${DASHSCOPE_API_KEY:}
      model: text-embedding-v3
      dimensions: 1024
    rabbit:
      enabled: ${RABBITMQ_ENABLED:false}
      parse-queue: raglaw.parse
      index-queue: raglaw.index
      parse-dlq: raglaw.parse.dlq
      index-dlq: raglaw.index.dlq
    outbox:
      enabled: ${OUTBOX_ENABLED:true}
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:30000}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      failed-retry-delay-ms: ${OUTBOX_FAILED_RETRY_DELAY_MS:60000}
    retrieval:
      display-excerpt-max-chars: 200
      llm-context-max-chars: 800
      max-chunks-per-document: 2
      candidate-multiplier: 2
      vector-min-similarity: 0.40
      fulltext-min-ratio: 0.30
      funnel-enabled: true
      document-confidence-threshold: 0.55
      topic-confidence-threshold: 0.45
      funnel-top-documents: 3
      funnel-top-topics: 3
      funnel-max-document-candidates: 50
    contract:
      enabled: true
      model: qwen-max
      chunks-per-batch: 6
      max-risks-per-document: 30
      rag-hit-limit: 8
  llm:
    mock: ${RAGLAW_LLM_MOCK:false}
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    default-model: qwen-plus
  agentscope:
    rag:
      mock: ${RAGLAW_AGENTSCOPE_RAG_MOCK:false}
    mcp:
      enabled: ${RAGLAW_MCP_ENABLED:false}
      endpoint: https://mcp.tavily.com/mcp
      api-key: ${TAVILY_API_KEY:}
      allowed-tools:
        - tavily-search
  langfuse:
    enabled: ${LANGFUSE_ENABLED:false}
    host: ${LANGFUSE_HOST:http://localhost:3001}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
