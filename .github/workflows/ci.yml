name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn test -B

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint:web
      - name: Build
        run: pnpm build:web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: raglaw-web
      - name: Start MySQL
        run: docker compose up -d mysql
        working-directory: docker
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if docker exec raglaw-mysql mysqladmin ping -h localhost -uraglaw -praglaw --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL not ready" >&2
          exit 1
      - name: Build backend
        run: mvn -B -q -pl raglaw-server -am package -DskipTests
        working-directory: backend
      - name: Start backend
        run: |
          nohup java -jar raglaw-server/target/raglaw-server-0.1.0-SNAPSHOT.jar \
            > /tmp/raglaw-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start" >&2
          tail -n 200 /tmp/raglaw-server.log || true
          exit 1
        env:
          RAGLAW_LLM_MOCK: 'true'
          RAGLAW_SEED_ADMIN_PASSWORD: raglaw-eval
          MYSQL_HOST: localhost
          MYSQL_PORT: '3307'
      - name: Seed E2E corpus
        run: bash scripts/seed-e2e-corpus.sh
        env:
          RAGLAW_SEED_ADMIN_PASSWORD: raglaw-eval
      - name: Run Playwright
        run: pnpm e2e
        env:
          CI: 'true'
          E2E_WITH_CORPUS: '1'
          E2E_ADMIN_PASSWORD: raglaw-eval
